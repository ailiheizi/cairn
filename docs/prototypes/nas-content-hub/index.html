      {id:'v1',type:'video',name:'沿湖散步.mp4',date:'2026-09-18',tags:['山间周末','沿途'],note:'原型生成的抽象色块短片，不是真实拍摄素材。',asset:'assets/harbor-walk.mp4',kind:'MP4 · 合成演示',summary:'浏览器原生视频控件播放本原型生成的五秒图形短片。'},
      {id:'d1',type:'docs',name:'山间周末路线.pdf',date:'2026-09-16',tags:['山间周末','路线'],note:'出发前整理的路线与补给清单。',kind:'PDF · 演示记录',asset:'assets/route-notes.pdf',summary:'山间周末路线小记',body:'这次从北坡入口出发，沿山脊步道前往杉木湖。\n\n建议携带：饮用水、轻便雨衣、头灯和一件保暖层。营地附近手机信号不稳定，出发前先保存离线地图。\n\n回程沿湖边木栈道绕行，天黑前抵达停车点。以上文字是原型作者编写的示例，不是实际导航建议。'},
      {id:'d2',type:'docs',name:'器材清单.txt',date:'2026-09-16',tags:['山间周末','清单'],note:'备用电池和灯具放在侧袋。',kind:'TXT · 演示记录',asset:'assets/checklist.txt',summary:'相机、电池、头灯、雨衣、保温杯。',body:'相机与备用电池\n头灯与充电线\n轻便雨衣\n保温杯\n急救包\n\n此清单为作者编写的演示内容。'}
    ];
    const names={all:'全部内容',photos:'照片',audio:'音频',video:'视频',docs:'文档'};
    let view='all', query='', activeTag='', inspectId=null, lastFocus=null;
    const app=document.querySelector('#app'), modalRoot=document.querySelector('#modalRoot'), search=document.querySelector('#search');
    const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const notes=Object.create(null);
    const noteOf=r=>notes[r.id]??r.note;
    function filtered(){return records.filter(r=>(view==='all'||r.type===view)&&(!activeTag||r.tags.includes(activeTag))&&(!query||[r.name,r.summary,r.album,r.artist,...r.tags,noteOf(r)].filter(Boolean).join(' ').toLocaleLowerCase().includes(query.toLocaleLowerCase())))}
    const tagCloud=['山间周末','风景','现场录音','路线','营地','清单'];
    function renderViewHeader(title,sub,action='') { return `<div class="heading"><div><p class="eyebrow">RESTOREWEAVE · 我的内容</p><h1>${title}</h1><p class="subhead">${sub}</p></div><div class="head-actions">${action}</div></div>` }
    function tags(){return `<div class="topic-row"><span class="topic-label">主题</span><button class="topic ${activeTag===''?'active':''}" data-tag="">全部</button>${tagCloud.map(t=>`<button class="topic ${activeTag===t?'active':''}" data-tag="${escapeHTML(t)}">${escapeHTML(t)} <span class="n">${records.filter(r=>r.tags.includes(t)).length}</span></button>`).join('')}</div>`}
    function photoCards(items){return `<div class="photo-grid">${items.map(r=>`<article class="photo-tile" tabindex="0" role="button" data-inspect="${r.id}" aria-label="查看 ${escapeHTML(r.name)}"><img src="${r.asset}" alt="${escapeHTML(r.name)}"><div class="tile-meta"><div class="tile-name">${escapeHTML(r.name)}</div><div class="tile-sub"><span>${escapeHTML(r.date)} · ${escapeHTML(r.place||'照片')}</span><span class="mini-tag">${escapeHTML(r.tags[0])}</span></div></div></article>`).join('')}</div>`}
    function imageFor(ids){return records.find(r=>ids.includes(r.id))}
    function renderPhotos(items){if(!items.length)return empty();const [lead,...rest]=items;return `<div class="section-title"><h2>最近的片刻</h2><small>${items.length} 张照片 · 演示图库</small></div><div class="photo-feature"><article class="feature-card" tabindex="0" role="button" data-inspect="${lead.id}" aria-label="查看 ${escapeHTML(lead.name)}"><img src="${lead.asset}" alt=""><div class="feature-copy"><div class="micro">${escapeHTML(lead.date)}　·　${escapeHTML(lead.place||'我的照片')}</div><h3>${escapeHTML(lead.name)}</h3><p>${escapeHTML(lead.note)}</p></div></article><div class="feature-side">${rest.slice(0,2).map(r=>`<article class="feature-card" tabindex="0" role="button" data-inspect="${r.id}" aria-label="查看 ${escapeHTML(r.name)}"><img src="${r.asset}" alt=""><div class="feature-copy"><div class="micro">${escapeHTML(r.date)}</div><h3>${escapeHTML(r.name)}</h3></div></article>`).join('')}</div></div><div class="section-title"><h2>按时间浏览</h2><small>日期来自演示记录</small></div>${photoCards(items)}<div class="section-title"><h2>旅程时间线</h2><small>同一标签下的内容也会出现在其它类型</small></div><div class="timeline">${[...new Set(items.map(r=>r.date))].map(d=>`<div class="timeline-row"><b>${d}</b><span>${items.filter(r=>r.date===d).map(r=>escapeHTML(r.name)).join('　·　')}</span></div>`).join('')}</div>`}
    function renderAudio(items){if(!items.length)return empty();const groups=Object.groupBy?Object.groupBy(items,r=>r.album||'未归类'):items.reduce((a,r)=>((a[r.album||'未归类']??=[]).push(r),a),{});return `<div class="audio-callout"><span class="wave">♫</span><span>按专辑和曲目浏览。下方控件播放本原型随附的合成音频，不代表生产服务能力。</span></div><div class="section-title"><h2>专辑与录音组</h2><small>${Object.keys(groups).length} 组 · 作者编写的演示元数据</small></div><div class="album-grid">${Object.entries(groups).map(([album,tracks])=>`<article class="album-card"><div class="album-cover"><img src="assets/photo-camp.svg" alt=""><span class="cover-label">演示专辑</span></div><div><div class="album-title">${escapeHTML(album)}</div><div class="album-by">${escapeHTML(tracks[0].artist||'未填写')} · ${tracks.length} 首</div></div><div class="track-list">${tracks.map(r=>`<div class="track-row"><span class="track-num">${r.track||'♪'}</span><span class="track-name">${escapeHTML(r.name)}</span><span class="track-time">${r.duration||'—'}</span><audio class="track-audio" controls preload="none" src="${r.asset}" aria-label="播放 ${escapeHTML(r.name)}"></audio></div>`).join('')}</div><div class="album-note">专辑、艺人和曲序均为原型作者编写的演示字段。</div></article>`).join('')}</div>`}
    function renderVideo(items){if(!items.length)return empty();const active=items[0];return `<div class="section-title"><h2>视频片段</h2><small>本地生成的短演示素材</small></div><div class="video-grid"><section class="video-stage"><video controls preload="metadata" poster="assets/photo-lake.svg" src="${active.asset}" aria-label="${escapeHTML(active.name)}"></video><div class="video-caption"><div><strong>${escapeHTML(active.name)}</strong><br><small>${escapeHTML(active.date)} · ${escapeHTML(active.kind)}</small></div><button class="soft-btn" data-inspect="${active.id}">查看信息</button></div></section><div class="clip-list">${items.map(r=>`<article class="clip-card" tabindex="0" role="button" data-inspect="${r.id}"><div class="clip-thumb"><img src="assets/photo-lake.svg" alt=""></div><div><b>${escapeHTML(r.name)}</b><small>${escapeHTML(r.date)} · 合成短片</small></div></article>`).join('')}<p class="album-note">视频控件播放仓库内附带的本地生成 MP4。不是实拍视频，也不调用网络。</p></div></div>`}
    function renderDocs(items){if(!items.length)return empty();return `<div class="section-title"><h2>文档与清单</h2><small>选择一项可在本页阅读演示摘录</small></div><div class="doc-layout">${items.map(r=>`<article class="doc-card" tabindex="0" role="button" data-inspect="${r.id}"><div class="doc-icon">▤</div><div><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.summary)}</p><small>${escapeHTML(r.date)} · ${escapeHTML(r.kind)}</small></div></article>`).join('')}</div>${items[0].body?`<article class="doc-sheet"><div class="doc-kicker">本地演示摘录 · 作者编写</div><h2>${escapeHTML(items[0].summary)}</h2><div class="doc-meta">${escapeHTML(items[0].name)}　·　${escapeHTML(items[0].date)}</div>${items[0].body.split('\n\n').map(p=>`<p>${escapeHTML(p).replaceAll('\n','<br>')}</p>`).join('')}</article>`:''}`}
    function renderAll(items){if(!items.length)return empty();const photos=items.filter(r=>r.type==='photos');const audios=items.filter(r=>r.type==='audio');const rest=items.filter(r=>!['photos','audio'].includes(r.type));return `${photos.length?`<div class="section-title"><h2>照片里的最近时刻</h2><button class="soft-btn" data-switch="photos">浏览照片　→</button></div>${photoCards(photos.slice(0,3))}`:''}${audios.length?`<div class="section-title"><h2>声音与录音</h2><button class="soft-btn" data-switch="audio">浏览音频　→</button></div><div class="album-grid">${[...new Set(audios.map(r=>r.album))].map(album=>{const list=audios.filter(r=>r.album===album);return `<article class="album-card"><div class="album-cover"><img src="assets/photo-camp.svg" alt=""><span class="cover-label">演示专辑</span></div><div><div class="album-title">${escapeHTML(album)}</div><div class="album-by">${escapeHTML(list[0].artist)} · ${list.length} 首</div></div><div class="track-list">${list.slice(0,2).map(r=>`<div class="track-row"><span class="track-num">${r.track}</span><span class="track-name">${escapeHTML(r.name)}</span><span class="track-time">${r.duration}</span><audio class="track-audio" controls preload="none" src="${r.asset}" aria-label="播放 ${escapeHTML(r.name)}"></audio></div>`).join('')}</div><div class="album-note">作者编写的演示专辑信息</div></article>`}).join('')}</div>`:''}${rest.length?`<div class="section-title"><h2>其它内容</h2><small>${rest.length} 项</small></div><div class="doc-layout">${rest.map(r=>`<article class="doc-card" tabindex="0" role="button" data-inspect="${r.id}"><div class="doc-icon">${r.type==='video'?'▷':'▤'}</div><div><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.summary)}</p><small>${escapeHTML(r.date)} · ${escapeHTML(names[r.type])}</small></div></article>`).join('')}</div>`:''}`}
    function empty(){return `<div class="empty"><strong>这里暂时没有匹配内容</strong>换一个关键词或主题标签，看看其它类型。</div>`}
    function render(){const items=filtered();document.querySelector('#crumbName').textContent=names[view];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-count]').forEach(e=>e.textContent=records.filter(r=>e.dataset.count==='all'||r.type===e.dataset.count).length);let action='<button class="soft-btn" data-show-all>清除筛选</button>';const headings={all:['全部内容','按内容类型浏览，也可以用主题标签找到跨类型的同一段记忆。'],photos:['照片','用画面和时间回看；每张卡片仍对应一份可检查、可取回的内容。'],audio:['音频','按专辑与曲目浏览，并播放随原型提供的本地合成音频。'],video:['视频','在同一内容空间中查看并播放随原型提供的本地短片。'],docs:['文档','阅读内容摘录，也可以检查原始项目和关联主题。']};const [title,sub]=headings[view];app.innerHTML=renderViewHeader(title,sub,action)+tags()+`<div class="result-count">当前视图 ${items.length} 项</div>`+(view==='photos'?renderPhotos(items):view==='audio'?renderAudio(items):view==='video'?renderVideo(items):view==='docs'?renderDocs(items):renderAll(items));bind();}
    function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{activeTag=b.dataset.tag;render()});document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{view=b.dataset.switch;render()});document.querySelectorAll('[data-show-all]').forEach(b=>b.onclick=()=>{query='';activeTag='';search.value='';view='all';render()});document.querySelectorAll('[data-inspect]').forEach(el=>{el.onclick=()=>openInspect(el.dataset.inspect,el);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInspect(el.dataset.inspect,el)}}})}
    function openInspect(id,trigger){const r=records.find(x=>x.id===id);if(!r)return;inspectId=id;lastFocus=trigger||document.activeElement;const media=r.type==='photos'?`<img class="inspect-preview" src="${r.asset}" alt="${escapeHTML(r.name)}">`:r.type==='video'?`<video class="inspect-preview" controls preload="none" src="${r.asset}" aria-label="${escapeHTML(r.name)}"></video>`:r.type==='audio'?`<audio controls preload="none" src="${r.asset}" aria-label="${escapeHTML(r.name)}"></audio>`:r.body?`<div class="doc-sheet"><p>${escapeHTML(r.body).replaceAll('\n','<br>')}</p></div>`:'';modalRoot.innerHTML=`<div class="modal-backdrop" data-backdrop><section class="inspect" role="dialog" aria-modal="true" aria-labelledby="inspectTitle"><div class="inspect-head"><h2 id="inspectTitle">${escapeHTML(r.name)}</h2><button class="close" aria-label="关闭检查面板" data-close>×</button></div><div class="inspect-body">${media}<p class="inspect-description">${escapeHTML(r.summary)}</p><div class="inspect-meta"><span class="meta-chip">${escapeHTML(names[r.type])}</span><span class="meta-chip">${escapeHTML(r.kind)}</span><span class="meta-chip">${escapeHTML(r.date)}</span>${r.album?`<span class="meta-chip">${escapeHTML(r.album)}</span>`:''}</div><h3>主题标签</h3><div class="topic-row">${r.tags.map(t=>`<button class="topic" data-modal-tag="${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('')}</div><h3>Notes · 演示备注</h3><textarea class="note-box" id="noteInput" aria-label="演示备注">${escapeHTML(noteOf(r))}</textarea><div class="note-help">只保存在当前页面内存；刷新后会清除。</div><div class="inspect-actions"><button class="soft-btn" data-save-note>保存备注</button><a class="download" href="${r.asset||'#'}" ${r.asset?'download':''} data-download>↓　下载演示原件</a></div></div></section></div>`;modalRoot.querySelector('[data-close]').onclick=closeInspect;modalRoot.querySelector('[data-backdrop]').onclick=e=>{if(e.target===e.currentTarget)closeInspect()};modalRoot.querySelector('[data-save-note]').onclick=()=>{notes[id]=modalRoot.querySelector('#noteInput').value;showToast('备注已保存在当前演示会话')};modalRoot.querySelectorAll('[data-modal-tag]').forEach(b=>b.onclick=()=>{activeTag=b.dataset.modalTag;closeInspect();render()});modalRoot.querySelector('[data-download]').onclick=e=>{if(!r.asset){e.preventDefault();const blob=new Blob([r.body||r.summary],{type:'text/plain'});e.currentTarget.href=URL.createObjectURL(blob);e.currentTarget.download=r.name.replace(/\.pdf$/i,'.txt')}showToast('演示文件已交给浏览器下载')};modalRoot.querySelector('.close').focus()}
    function closeInspect(){modalRoot.innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();inspectId=null}
    let toastTimer;function showToast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}
    search.addEventListener('input',()=>{query=search.value.trim();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&inspectId)closeInspect();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}if(inspectId&&e.key==='Tab'){const d=modalRoot.querySelector('[role=dialog]');const els=[...d.querySelectorAll('button,a,textarea,audio,video')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    render();
  </script>
</body>
</html>
